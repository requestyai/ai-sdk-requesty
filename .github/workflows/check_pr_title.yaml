name: Check PR Title

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  validate-pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$PR_TITLE" =~ ^\[eng-0*[1-9][0-9]*\]\ .+ ]]; then
            echo "::error ::PR title must follow format: [eng-1234] Your title (ticket number can't be 0)"
            exit 1
          fi
